<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Martin Engel</title>
<style>
  :root {
    --waldgruen: #1F3D2B;
    --papierweiss: #F5F1EA;
    --holz: #A67C52;
    --mandarine: #FF7A1A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--papierweiss);
    font-family: Georgia, "Times New Roman", serif;
    color: var(--waldgruen);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8vw 6vw;
    gap: 6vw;
    text-align: center;
  }
  .brand {
    font-size: clamp(28px, 9vw, 52px);
    font-weight: 300;
    letter-spacing: -0.035em;
    line-height: 1.1;
  }
  .brand .dot {
    display: inline-block;
    width: 0.28em;
    height: 0.28em;
    background: var(--mandarine);
    border-radius: 50%;
    vertical-align: baseline;
    margin: 0 0.02em;
    position: relative;
    top: -0.05em;
  }
  .brand .gemacht {
    display: block;
    font-family: Caveat Brush, "Segoe Script", cursive;
    color: var(--mandarine);
    font-size: 0.72em;
    font-weight: 400;
    margin-top: 0.15em;
    transform: rotate(-7deg);
    letter-spacing: 0;
  }
  .name {
    font-size: clamp(26px, 8vw, 44px);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .line {
    font-size: clamp(15px, 4.2vw, 22px);
    font-style: italic;
    color: var(--waldgruen);
    opacity: 0.72;
    max-width: 28em;
    line-height: 1.4;
  }
  .qr-wrap {
    background: var(--papierweiss);
    padding: 4vw;
    border-radius: 2vw;
  }
  .qr-wrap img {
    display: block;
    width: min(58vw, 240px);
    height: auto;
  }
  .qr-label {
    font-size: clamp(12px, 3.2vw, 16px);
    color: var(--holz);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2vw;
  }
  .contact {
    font-size: clamp(14px, 3.8vw, 19px);
    color: var(--waldgruen);
    opacity: 0.85;
    line-height: 1.7;
  }
  .contact a {
    color: var(--waldgruen);
    text-decoration: none;
  }
  .rule {
    width: min(40vw, 160px);
    height: 1px;
    background: var(--holz);
    opacity: 0.5;
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .card { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4vw 8vw; padding: 4vw; }
    .brand, .name, .line { text-align: left; }
    .qr-wrap { order: 3; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <div class="brand">
      Daten<span class="dot"></span> KI<span class="dot"></span> Verständlich<span class="dot"></span>
      <span class="gemacht">gemacht</span>
    </div>
    <div class="name">Martin Engel</div>
    <div class="line">Du kennst deinen Laden. Ich verbinde ihn mit KI.</div>
    <div class="rule"></div>
    <div class="qr-wrap">
      <img src="https://eduardosopalda.github.io/on-the-dot/qr/martin-engel-qr.svg" alt="QR Code zu Martin Engels Seite">
      <div class="qr-label">Scannen und verbinden</div>
    </div>
    <div class="contact">
      +49 160 99 666 776<br>
      <a href="mailto:martinengel1975@outlook.de">martinengel1975@outlook.de</a>
    </div>
  </div>
</body>
</html>
